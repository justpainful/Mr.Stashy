name: Screenshot review

on:
  workflow_dispatch:
  push:
    tags: ["v*-rc*"]

permissions:
  contents: read

env:
  SCHEME: MrStashy
  XCODE_PATH: /Applications/Xcode_26.5.0.app/Contents/Developer
  TUIST_XDG_CACHE_HOME: /tmp/tuist-cache
  TUIST_XDG_STATE_HOME: /tmp/tuist-state

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode 26.5.0
        run: |
          test -d "$XCODE_PATH"
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version
      - uses: jdx/mise-action@v2
      - run: bash scripts/bootstrap.sh
      - name: Capture required English, Arabic, light, and dark flows
        run: |
          device="$(bash scripts/boot_simulator.sh)"
          bash scripts/capture_screenshots.sh "$SCHEME" "platform=iOS Simulator,id=$device"
      - name: Create screenshot archive
        run: ditto -c -k --sequesterRsrc --keepParent Artifacts/Screenshots Artifacts/MrStashy-Screenshots.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MrStashy-Screenshots
          path: |
            Artifacts/MrStashy-Screenshots.zip
            Artifacts/Screenshots
            Artifacts/Screenshots.xcresult
            Artifacts/Logs/screenshots.log
          if-no-files-found: warn
