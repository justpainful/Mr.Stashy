name: Record Stashy demo tour

on:
  workflow_dispatch:
  # Lets the feature branch produce its first delivery artifact before this workflow reaches main.
  push:
    branches: [codex/build-stashy-v1]
    paths:
      - .github/workflows/demo-tour.yml
      - MrStashy/**
      - MrStashyUITests/**
      - Resources/**

permissions:
  contents: read

concurrency:
  group: demo-tour-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: MrStashy
  XCODE_PATH: /Applications/Xcode_26.5.0.app/Contents/Developer
  TUIST_XDG_CACHE_HOME: /tmp/tuist-cache
  TUIST_XDG_STATE_HOME: /tmp/tuist-state

jobs:
  record-demo-tour:
    name: Record deterministic app tour and unsigned IPA
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode 26.5.0
        run: |
          test -d "$XCODE_PATH"
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version
      - uses: jdx/mise-action@v2
      - name: Generate project
        run: bash scripts/bootstrap.sh
      - name: Record the automated product tour
        shell: bash
        run: |
          set -euo pipefail
          device="$(bash scripts/boot_simulator.sh)"
          mkdir -p Artifacts/Demo Artifacts/Screenshots Artifacts/Logs
          raw_recording="$(pwd -P)/Artifacts/Demo/Stashy-demo-tour-raw.mov"
          recording="$(pwd -P)/Artifacts/Demo/Stashy-demo-tour.mp4"
          xcrun simctl io "$device" recordVideo --codec=h264 "$raw_recording" &
          recorder_pid=$!
          stop_recording() {
            kill -INT "$recorder_pid" 2>/dev/null || true
            wait "$recorder_pid" 2>/dev/null || true
          }
          trap stop_recording EXIT INT TERM
          RESULT_BUNDLE=Artifacts/MrStashyDemoTour.xcresult \
          XCODEBUILD_LOG=Artifacts/Logs/demo-tour.log \
          SCREENSHOTS_DIR="$(pwd -P)/Artifacts/Screenshots" \
            bash scripts/ui_test.sh "$SCHEME" "platform=iOS Simulator,id=$device"
          stop_recording
          trap - EXIT INT TERM
          test -s "$raw_recording"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          # Simulator recordings use variable timestamps and a very tall frame. Re-encode
          # to a broadly playable MP4 rather than shipping a QuickTime container by name.
          ffmpeg -y -fflags +genpts -i "$raw_recording" -map 0:v:0 \
            -vf 'scale=-2:1920:flags=lanczos,fps=30' \
            -c:v libx264 -profile:v high -level:v 4.1 -pix_fmt yuv420p \
            -movflags +faststart -an "$recording"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,pix_fmt,level,avg_frame_rate \
            -of default=noprint_wrappers=1 "$recording"
          test -s "$recording"
      - name: Build unsigned sideload IPA
        run: bash scripts/package_ipa.sh "$SCHEME"
      - name: Assemble delivery folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Artifacts/Delivery
          cp Artifacts/MrStashy-unsigned.ipa Artifacts/Delivery/Stashy-unsigned.ipa
          cp Artifacts/MrStashy-dSYM.zip Artifacts/Delivery/Stashy-dSYM.zip
          cp Artifacts/Demo/Stashy-demo-tour.mp4 Artifacts/Delivery/Stashy-demo-tour.mp4
          cp -R Artifacts/Screenshots Artifacts/Delivery/Screenshots
          cat > Artifacts/Delivery/README.txt <<'EOF'
          Stashy — ملف التسليم

          - Stashy-unsigned.ipa: حزمة iOS غير موقعة للتثبيت الجانبي.
          - Stashy-demo-tour.mp4: تسجيل فعلي متوافق بصيغة H.264 لجولة التطبيق الآلية.
          - Screenshots/: لقطات منفصلة من المسار نفسه.
          - Stashy-dSYM.zip: رموز التصحيح لبناء الإصدار.

          الجولة تستخدم بيانات محلية حتمية في واجهة الاختبار، ولا تستخدم حسابات أو
          جلسات خاصة أو تنزيلات من منصات حية. لذلك فهي تثبت الواجهة وتدفق التطبيق
          بدون الادعاء بأن مصدرًا خارجيًا متاح أو ثابت في وقت تشغيل الـworkflow.
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Stashy-delivery
          path: |
            Artifacts/Delivery
            Artifacts/Logs/demo-tour.log
            Artifacts/MrStashyDemoTour.xcresult
          if-no-files-found: warn
